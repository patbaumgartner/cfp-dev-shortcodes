name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tagged commit is on main
        run: |
          git fetch origin main --tags --force
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run quality checks
        run: composer check

  build:
    name: Build & publish release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive plugin slug and version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"           # e.g. v4.1.0
          VERSION="${TAG#v}"                  # e.g. 4.1.0
          SLUG="cfp-dev-shortcodes"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG"       >> "$GITHUB_OUTPUT"
          echo "zip=${SLUG}-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Verify plugin version matches the tag
        run: |
          TAG_VERSION="${{ steps.meta.outputs.version }}"
          PLUGIN_FILE="cfp-dev-wordpress-shortcodes.php"

          HEADER_VERSION=$(grep -oP '^ \* Version:\s+\K\S+' "$PLUGIN_FILE")
          CONST_VERSION=$(grep -oP "define\(\s*'CFP_DEV_VERSION',\s*'\K[^']+" "$PLUGIN_FILE")

          fail=0
          if [ "$HEADER_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: plugin header version ($HEADER_VERSION) does not match tag ($TAG_VERSION)"
            fail=1
          fi
          if [ "$CONST_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: CFP_DEV_VERSION ($CONST_VERSION) does not match tag ($TAG_VERSION)"
            fail=1
          fi
          if ! grep -q "^## \[$TAG_VERSION\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no entry for $TAG_VERSION"
            fail=1
          fi
          exit "$fail"

      - name: Build and verify release ZIP
        run: |
          SLUG="${{ steps.meta.outputs.slug }}"
          ZIP="${{ steps.meta.outputs.zip }}"

          git archive --format=zip --prefix="${SLUG}/" --output="$ZIP" HEAD

          entries="$(unzip -Z1 "$ZIP")"
          if printf '%s\n' "$entries" | grep -Evq "^${SLUG}/"; then
            echo "ERROR: release ZIP contains an entry outside ${SLUG}/"
            exit 1
          fi

          if printf '%s\n' "$entries" | grep -Eq "^${SLUG}/(\.gitattributes|\.gitignore|\.github/|bin/|tests/|vendor/|composer\.json|composer\.lock|phpcs\.xml\.dist|phpunit\.xml\.dist)(/|$)"; then
            echo "ERROR: release ZIP contains development or repository files"
            exit 1
          fi

          for required in \
            "${SLUG}/cfp-dev-wordpress-shortcodes.php" \
            "${SLUG}/uninstall.php" \
            "${SLUG}/LICENSE.txt" \
            "${SLUG}/shortcode/" \
            "${SLUG}/js/" \
            "${SLUG}/images/"; do
            if ! printf '%s\n' "$entries" | grep -Fq "$required"; then
              echo "ERROR: release ZIP is missing required runtime path: $required"
              exit 1
            fi
          done

          sha256sum "$ZIP" > "${ZIP}.sha256"
          echo "Built: ${ZIP}"
          cat "${ZIP}.sha256"

      - name: Attest release artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "${{ steps.meta.outputs.zip }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "v${{ steps.meta.outputs.version }}"
          tag_name: "${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: |
            ${{ steps.meta.outputs.zip }}
            ${{ steps.meta.outputs.zip }}.sha256
