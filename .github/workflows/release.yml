name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: Build & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive plugin slug and version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"           # e.g. v4.1.0
          VERSION="${TAG#v}"                  # e.g. 4.1.0
          SLUG="cfp-dev-shortcodes"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG"       >> "$GITHUB_OUTPUT"
          echo "zip=${SLUG}-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Verify plugin header version matches tag
        run: |
          HEADER_VERSION=$(grep -Po "(?<=Version:\s{11})\S+" cfp-dev-wordpress-shortcodes.php)
          TAG_VERSION="${{ steps.meta.outputs.version }}"
          if [ "$HEADER_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Plugin header version ($HEADER_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build ZIP (production files only, no vendor/ or dev artifacts)
        run: |
          SLUG="${{ steps.meta.outputs.slug }}"
          ZIP="${{ steps.meta.outputs.zip }}"

          # Assemble the production tree under a directory named after the slug
          # so WordPress extracts to wp-content/plugins/cfp-dev-shortcodes/
          mkdir -p "dist/${SLUG}"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='vendor' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpcs.xml.dist' \
            --exclude='*.md' \
            --exclude='README.txt' \
            --exclude='ChangeLog.md' \
            ./ "dist/${SLUG}/"

          cd dist
          zip -r "../${ZIP}" "${SLUG}/"
          cd ..
          echo "Built: ${ZIP}"
          unzip -l "${ZIP}" | head -30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "v${{ steps.meta.outputs.version }}"
          tag_name: "${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: "${{ steps.meta.outputs.zip }}"
