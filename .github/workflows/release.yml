name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: Build & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive plugin slug and version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"           # e.g. v4.1.0
          VERSION="${TAG#v}"                  # e.g. 4.1.0
          SLUG="cfp-dev-shortcodes"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG"       >> "$GITHUB_OUTPUT"
          echo "zip=${SLUG}-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Verify plugin version matches the tag
        run: |
          TAG_VERSION="${{ steps.meta.outputs.version }}"
          PLUGIN_FILE="cfp-dev-wordpress-shortcodes.php"

          HEADER_VERSION=$(grep -oP '^ \* Version:\s+\K\S+' "$PLUGIN_FILE")
          CONST_VERSION=$(grep -oP "define\(\s*'CFP_DEV_VERSION',\s*'\K[^']+" "$PLUGIN_FILE")

          fail=0
          if [ "$HEADER_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: plugin header version ($HEADER_VERSION) does not match tag ($TAG_VERSION)"
            fail=1
          fi
          if [ "$CONST_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: CFP_DEV_VERSION ($CONST_VERSION) does not match tag ($TAG_VERSION)"
            fail=1
          fi
          if ! grep -q "^## \[$TAG_VERSION\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no entry for $TAG_VERSION"
            fail=1
          fi
          exit "$fail"

      - name: Build ZIP (production files only, no vendor/ or dev artifacts)
        run: |
          SLUG="${{ steps.meta.outputs.slug }}"
          ZIP="${{ steps.meta.outputs.zip }}"

          # Assemble the production tree under a directory named after the slug
          # so WordPress extracts to wp-content/plugins/cfp-dev-shortcodes/
          mkdir -p "dist/${SLUG}"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='tests' \
            --exclude='vendor' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpcs.xml.dist' \
            --exclude='phpunit.xml.dist' \
            --exclude='.phpunit.cache' \
            --exclude='*.md' \
            ./ "dist/${SLUG}/"

          # A stray test or dev artifact in a released ZIP is shipped code.
          for unwanted in tests vendor composer.json phpunit.xml.dist; do
            if [ -e "dist/${SLUG}/${unwanted}" ]; then
              echo "ERROR: ${unwanted} leaked into the release ZIP"
              exit 1
            fi
          done

          cd dist
          zip -r "../${ZIP}" "${SLUG}/"
          cd ..
          echo "Built: ${ZIP}"
          unzip -l "${ZIP}" | head -30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "v${{ steps.meta.outputs.version }}"
          tag_name: "${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: "${{ steps.meta.outputs.zip }}"
